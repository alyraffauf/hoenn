# Input
xkb_rules_layout=us
xkb_rules_options=ctrl:nocaps
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_disable_while_typing=1
trackpad_natural_scrolling=1
mouse_natural_scrolling=1
trackpad_scroll_method=1
trackpad_click_method=2
touch_map_to_mon=eDP-1
cursor_theme=Adwaita
cursor_size=24
sloppyfocus=1
warpcursor=0
focus_cross_monitor=0
focus_cross_tag=0

# Outputs
monitorrule=model:27C1U-D,width:3840,height:2160,refresh:60,scale:1.87,rr:0
monitorrule=model:0x233D,width:1920,height:1080,refresh:60.049,scale:1.25,rr:0
monitorrule=model:0x41AA,width:2880,height:1800,refresh:120.001,scale:2,rr:0,vrr:1

# Scroller
tag_num=9
tagrule=id:*,layout_name:scroller
scroller_structs=20
scroller_default_proportion=0.5
scroller_ignore_proportion_single=1
scroller_default_proportion_single=0.5
scroller_proportion_preset=0.33333,0.5,0.66667
scroller_prefer_overspread=0
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0

# Appearance
gappih=8
gappiv=8
gappoh=8
gappov=8
borderpx=0
border_radius=10
no_radius_when_single=0
shadows=1
shadow_only_floating=0
shadows_size=30
shadows_blur=30
shadows_position_x=0
shadows_position_y=5
shadowscolor=0x00000077

# Animations
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
animation_duration_move=250
animation_duration_open=200
animation_duration_tag=250
animation_duration_close=200
animation_duration_focus=0
tag_animation_direction=0

# Launcher
bind=SUPER,t,spawn,ghostty
bind=SUPER,d,spawn,noctalia msg panel-toggle launcher
bind=SUPER,space,spawn,vicinae open
bind=SUPER,s,spawn,noctalia msg screenshot-region
bind=SUPER+ALT,l,spawn,noctalia msg session lock

# Media keys
bindl=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up 5
bindl=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down 5
bindl=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bindl=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute
bindl=NONE,XF86AudioPlay,spawn,noctalia msg media toggle
bindl=NONE,XF86AudioStop,spawn,noctalia msg media stop
bindl=NONE,XF86AudioPrev,spawn,noctalia msg media previous
bindl=NONE,XF86AudioNext,spawn,noctalia msg media next
bindl=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up 5
bindl=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down 5

# Overview and window focus
bind=SUPER,o,toggleoverview
bind=SUPER,q,killclient
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

# Window movement
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,Right,exchange_client,right
bind=SUPER+CTRL,h,exchange_client,left
bind=SUPER+CTRL,j,exchange_client,down
bind=SUPER+CTRL,k,exchange_client,up
bind=SUPER+CTRL,l,exchange_client,right

# Monitor focus
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Down,focusmon,down
bind=SUPER+SHIFT,Up,focusmon,up
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT,h,focusmon,left
bind=SUPER+SHIFT,j,focusmon,down
bind=SUPER+SHIFT,k,focusmon,up
bind=SUPER+SHIFT,l,focusmon,right

# Move a window to another monitor
bind=SUPER+SHIFT+CTRL,Left,tagmon,left,1
bind=SUPER+SHIFT+CTRL,Down,tagmon,down,1
bind=SUPER+SHIFT+CTRL,Up,tagmon,up,1
bind=SUPER+SHIFT+CTRL,Right,tagmon,right,1
bind=SUPER+SHIFT+CTRL,h,tagmon,left,1
bind=SUPER+SHIFT+CTRL,j,tagmon,down,1
bind=SUPER+SHIFT+CTRL,k,tagmon,up,1
bind=SUPER+SHIFT+CTRL,l,tagmon,right,1

# Workspace focus
bind=SUPER,Page_Down,viewtoright_have_client,0
bind=SUPER,Page_Up,viewtoleft_have_client,0
bind=SUPER,u,viewtoright_have_client,0
bind=SUPER,i,viewtoleft_have_client,0

# Move a window to another workspace
bind=SUPER+CTRL,Page_Down,tagtoright,0
bind=SUPER+CTRL,Page_Up,tagtoleft,0
bind=SUPER+CTRL,u,tagtoright,0
bind=SUPER+CTRL,i,tagtoleft,0

# Workspaces by index
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0

# Wheel and touchpad navigation
axisbind=SUPER,UP,viewtoleft_have_client,0
axisbind=SUPER,DOWN,viewtoright_have_client,0
axisbind=SUPER+CTRL,UP,tagtoleft,0
axisbind=SUPER+CTRL,DOWN,tagtoright,0
axisbind=SUPER,LEFT,focusdir,left
axisbind=SUPER,RIGHT,focusdir,right
axisbind=SUPER+CTRL,LEFT,exchange_client,left
axisbind=SUPER+CTRL,RIGHT,exchange_client,right
gesturebind=NONE,up,3,viewtoright_have_client,0
gesturebind=NONE,down,3,viewtoleft_have_client,0

# Scroller operations
bind=SUPER,BracketLeft,scroller_stack,left
bind=SUPER,BracketRight,scroller_stack,right
bind=SUPER,comma,scroller_stack,left
bind=SUPER,period,scroller_stack,right
bind=SUPER,r,switch_proportion_preset
bind=SUPER+SHIFT,r,switch_proportion_preset
bind=SUPER,f,togglemaximizescreen
bind=SUPER+CTRL,f,set_proportion,1
bind=SUPER,minus,set_proportion,0.33333
bind=SUPER,equal,set_proportion,0.66667

# Floating and fullscreen windows
bind=SUPER,v,togglefloating
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,m,togglemaximizescreen

# Screenshots
bind=NONE,Print,spawn,noctalia msg screenshot-region
bind=CTRL,Print,spawn,noctalia msg screenshot-fullscreen

# Session
bind=SUPER+SHIFT,e,quit
bind=CTRL+ALT,Delete,quit
switchbind=fold,spawn,noctalia msg session lock-and-suspend

# Window rules
windowrule=isfloating:1,width:1080,height:920,appid:dev.noctalia.Noctalia
windowrule=isfloating:1,isglobal:1,appid:firefox,title:^Picture-in-Picture$
windowrule=shield_when_capture:1,appid:^org\.keepassxc\.KeePassXC$
windowrule=shield_when_capture:1,appid:^org\.gnome\.World\.Secrets$

# Startup
source-optional=~/.config/mango/noctalia.conf
exec-once=noctalia
exec-once=vicinae server
